<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestil pizza · STRETCH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:'Noot';src:url('./noot-aj.woff') format('woff');font-display:swap}
:root{--cream:#fff3df;--burgundy:#761827;--ink:#291719;--line:#c9928c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Instrument Sans',sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:21px max(22px,calc((100vw - 900px)/2));flex-wrap:wrap}
.brand{font:400 34px 'Noot','Bricolage Grotesque',sans-serif;text-decoration:none;color:var(--ink);letter-spacing:1px}
.back{color:var(--burgundy);font:800 15px 'Bricolage Grotesque',sans-serif;border:2px solid var(--burgundy);border-radius:100px;padding:10px 17px;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:12px 16px 38px}
.intro{text-align:center;margin:6px 0 22px}
.intro h1{font:800 clamp(27px,5vw,42px) 'Bricolage Grotesque',sans-serif;letter-spacing:-1px;margin:0 0 6px}
.intro p{font-size:16px;margin:0;color:#6d4c4c}
#shop{display:block;width:100%;height:1320px;border:0;background:transparent;overflow:hidden}
#warning{border:2px solid var(--line);padding:22px;border-radius:16px;background:#fff9ee}
footer{text-align:center;padding:0 18px 28px;font-size:13px;opacity:.7}
@media(max-width:520px){header{padding:16px}.brand{font-size:29px}.intro{margin-bottom:14px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html" aria-label="STRETCH forside">STRETCH</a><a class="back" href="index.html">← Til forsiden</a></header>
<main id="top"><div class="intro"><h1>Bestil din pizza</h1><p>Håndlavet pizza på Østerbro · Vælg dine favoritter</p></div>
<div id="warning" hidden>Bestillingssiden mangler endnu webapp-linket. Se installationsvejledningen.</div>
<iframe id="shop" title="STRETCH onlinebestilling" scrolling="no" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main><footer>STRETCH · Contemporary pizza · Østerbro</footer>
<script>
// INDSÆT DIN EKSISTERENDE APPS SCRIPT WEBAPP-URL (/exec) HER.
const STRETCH_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzjKuUuEttI8nBSs0Bz_qTaCN7YTB23-S0Dd0sRaZru6XltClubnl4qmexiJiyXHZxBxA/exec';
const shop=document.getElementById('shop');
if(/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(STRETCH_WEBAPP_URL)){
 shop.src=STRETCH_WEBAPP_URL;
}else{
 shop.hidden=true;document.getElementById('warning').hidden=false;
}
window.addEventListener('message',function(event){
 // Apps Script bruger en ekstra indre iframe. event.source er derfor
 // normalt ikke shop.contentWindow, når beskeden kommer fra OrderPage.
 const host=location.hostname;
 const allowedOrigin=/^https:\/\/(?:[a-z0-9-]+\.)*googleusercontent\.com$/i.test(event.origin)
   || event.origin==='https://script.google.com'
   || (location.protocol==='file:' && event.origin==='null');
 if(!allowedOrigin || !event.data || typeof event.data.type!=='string')return;
 const type=event.data.type;
 if(type==='STRETCH_FRAME_HEIGHT'){
   const height=Number(event.data.height);
   if(Number.isFinite(height)&&height>=200&&height<=10000)shop.style.height=height+'px';
 }else if(type==='STRETCH_ORDER_SUCCESS'||type==='STRETCH_ORDER_TOP'){
   window.scrollTo({top:0,behavior:'smooth'});
 }else if(type==='STRETCH_GO_HOME'){
   window.location.assign('index.html');
 }
});
</script>
</body>
</html>
